name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: unitech
          POSTGRES_PASSWORD: unitech
          POSTGRES_DB: unitech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unitech" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Testler (bellek + PostgreSQL)
        run: go test -race -count=1 -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://unitech:unitech@localhost:5432/unitech_test?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-a-long-random-looking-secret-key-1234567890
      - name: Çeviri kontrolü
        run: python check_i18n.py
      - run: DJANGO_SECRET_KEY=ci DJANGO_DEBUG=0 python manage.py collectstatic --noinput -v0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t unitech-api backend
      - run: docker build -t unitech-web frontend
