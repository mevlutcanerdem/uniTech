services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unitech
      POSTGRES_PASSWORD: unitech
      POSTGRES_DB: unitech
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unitech"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://unitech:unitech@db:5432/unitech?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanımla (.env dosyasına bak)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY tanımla (.env dosyasına bak)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DEV_LOG: ${MAIL_DEV_LOG:-}
    ports:
      - "8080:8080"   # tarayıcı canlı panel akışı için buna bağlanır
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY tanımla (.env dosyasına bak)}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
